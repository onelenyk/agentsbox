# Sisyphus configuration — copy to `config.yaml` and adjust. `config.yaml` is
# gitignored because the daemon writes to it (Repos → Add / Edit / Delete).
#
#   cp config.example.yaml config.yaml
#
# Every key is optional; a missing config.yaml means "all defaults".
# `${VAR}` is expanded from the environment (.env is loaded first).

api:
  allow_localhost: true          # loopback callers skip the bearer token
  token: ${SISYPHUS_API_TOKEN}   # empty = whole HTTP surface open (local use)
                                 # set = token gates the UI and the API alike;
                                 # reach the UI over an SSH tunnel, since a
                                 # browser cannot send a bearer header

self_update:
  auto_restart_when_idle: false  # true = when the daemon's own code is behind the
                                 # merged checkout and no worker is running,
                                 # restart the daemon on its own (a restart is
                                 # safe: tasks are paused as "closed" and resume
                                 # on boot). False = only ever restart on the
                                 # button. The button itself is always safe.
  check_seconds: 5               # how often the daemon looks for a pending or
                                 # auto restart once idle (cheap in-process
                                 # worker check; only spawns when nothing runs)

notify:
  webhook_url: ${SISYPHUS_NOTIFY_URL}  # empty = off. One JSON POST per notable
                                       # event (task failed/parked, preflight not
                                       # ready): {event, task_id, title, reason,
                                       # url, ts}. Point it at anything that
                                       # accepts a POST — ntfy.sh, a chat
                                       # webhook relay, curl in a pipe.

backup:
  interval_seconds: 86400        # daily DB snapshot into {workspace}/backups
                                 # (newest 14 kept); 0 = scheduled snapshots off

sandbox:
  # require: false               # unset = required wherever a backend exists
                                 # (macOS), so running unconfined takes two
                                 # deliberate steps: SISYPHUS_SANDBOX=0 AND this
                                 # set to false. On a platform with no backend
                                 # (Linux) unset means not required — the
                                 # launcher announces every unconfined run.
  # read_isolation: true         # unset/false = off. When on, a worker can READ
                                 # only the workspace, worktree, output dir, and
                                 # allowlisted paths under $HOME (credentials,
                                 # caches, toolchain state dirs). Blocks exfiltration
                                 # of secrets from other projects via prompt injection.
                                 # Verified with the claude runner; opencode does
                                 # not run under it yet (docs/known-gaps.md).
  # egress: false                # opt-in network egress filtering: when true,
                                 # workers can only reach hosts on the allowlist
                                 # via an HTTP CONNECT proxy (port 443 only).
  # egress_allowlist: []         # custom allowlist (list of hosts). Unset =
                                 # default allowlist: api.anthropic.com, claude.ai,
                                 # *.claude.ai, statsig.anthropic.com, sentry.io,
                                 # opencode.ai, *.opencode.ai, openrouter.ai,
                                 # api.deepseek.com, models.dev, registry.npmjs.org

default_model: deepseek          # model for the seeded default runner
max_concurrent_workers: 2        # global worker cap
max_review_loops: 3              # engineer ↔ reviewer rounds before giving up
task_budget_usd: 5.0             # per-task spend cap
daily_budget_usd: 10.0           # unset = $10/day; an explicit 0 turns it off
autopilot_tick_seconds: 30       # how often schedules are checked
log_level: info

forge_poll:                      # follow published PRs/MRs by polling
  enabled: true
  interval_seconds: 300

# Forge and tracker credentials. A per-repo `token:` below beats these.
# Every credential ${VAR} is filled from Integrations → Keys & tokens (the
# Sisyphus vault) and from nowhere else. Never type a token here.
github:
  base_url: ${GITHUB_BASE_URL}                    # github.com or self-hosted
  token: ${GITHUB_TOKEN}                          # personal access token
gitlab:
  base_url: ${GITLAB_BASE_URL}                    # gitlab.com or self-hosted
  token: ${GITLAB_TOKEN}                          # personal access token
jira:                                             # Jira Cloud for issue tracking
  base_url: ${JIRA_BASE_URL}                      # https://your-domain.atlassian.net
  email: ${JIRA_EMAIL}                            # account email for Basic auth
  token: ${JIRA_API_TOKEN}                        # API token (not password)
  # intake:                                       # disabled; poll issues to create tasks
  #   enabled: false
  #   jql: "project = KMP AND type = Bug AND status = \"To Do\""  # issues to intake
  #   repo: my-app                                # which repo gets these tasks
  #   interval_seconds: 300                       # how often to check (min 60)
  #   max_per_pass: 50                            # max issues to create per check
openrouter:
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://openrouter.ai/api/v1
webhooks:
  secret: ${SISYPHUS_WEBHOOK_SECRET}

# Environment handed to every worker subprocess (on top of the allowlisted HOME).
worker_env:
  PATH: /opt/homebrew/bin:${PATH}

# Repositories. The UI manages this list (Repos → Add writes here); the keys
# the UI does not know about — `check:`, `setup:`, `token:` — are yours to add.
repos: []
