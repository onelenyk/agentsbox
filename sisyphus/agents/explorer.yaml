name: "Explorer"
model: "deepseek"
role: "Code investigation — explores codebases, reads files, searches patterns"
access: analyze
opencode_config:
  tools: [read, grep, glob, bash]
  max_tokens: 16000
  timeout: 120
  idle_timeout: 60
output_fields:
  status: required
  summary: required
  risk: optional
runner: opencode-default
