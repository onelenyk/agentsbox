name: "PM Assistant"
model: "deepseek"
role: "Gathers context from Jira issues and linked issues"
access: read
skills: [jira-reader]
opencode_config:
  tools: [read, grep, glob]
  max_tokens: 8000
  timeout: 600
output_fields:
  status: required
  summary: required
  risk: optional
runner: opencode-default
