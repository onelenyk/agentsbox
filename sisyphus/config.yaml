api:
  allow_localhost: true
  token: ${SISYPHUS_API_TOKEN}
default_model: deepseek
default_timeout: 300
github:
  base_url: ${GITHUB_BASE_URL}
  token: ${GITHUB_TOKEN}
gitlab:
  base_url: ${GITLAB_BASE_URL}
  token: ${GITLAB_TOKEN}
jira:
  base_url: ${JIRA_BASE_URL}
  email: ${JIRA_EMAIL}
  token: ${JIRA_API_TOKEN}
log_level: info
max_review_loops: 3
openrouter:
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://openrouter.ai/api/v1
repos:
- branch: main
  name: sisyphus
  source: /Users/dev/workproject/agentsbox
- branch: main
  name: testrepo
  source: /Users/dev/workproject/agentsbox/testrepo
- branch: main
  name: testrepo2
  source: /Users/dev/workproject/agentsbox/testrepo2
- branch: main
  name: testrepo-bug
  source: /Users/dev/workproject/agentsbox/testrepo-bug
scheduler:
  jobs:
  - minutes: 60
    name: orphan-cleanup
    trigger: interval
