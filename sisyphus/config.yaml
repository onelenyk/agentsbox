api:
  allow_localhost: true
  token: ${SISYPHUS_API_TOKEN}
autopilot_tick_seconds: 30
daily_budget_usd: 0
default_model: deepseek
github:
  base_url: ${GITHUB_BASE_URL}
  token: ${GITHUB_TOKEN}
gitlab:
  base_url: ${GITLAB_BASE_URL}
  token: ${GITLAB_TOKEN}
jira:
  base_url: ${JIRA_BASE_URL}
  email: ${JIRA_EMAIL}
  token: ${JIRA_API_TOKEN}
log_level: info
max_concurrent_workers: 2
max_review_loops: 3
openrouter:
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://openrouter.ai/api/v1
repos:
- branch: main
  name: sisyphus
  source: /Users/lenyk/workproject/agentsbox
- branch: main
  check: python3 -m pytest -q
  name: testrepo
  source: /Users/lenyk/workproject/agentsbox/testrepo
- branch: main
  check: python3 -m pytest -q
  name: testrepo2
  source: /Users/lenyk/workproject/agentsbox/testrepo2
- branch: main
  check: python3 -m pytest -q
  name: testrepo-bug
  source: /Users/lenyk/workproject/agentsbox/testrepo-bug
- branch: staging
  name: android-driver
  platform: gitlab
  source: /Users/lenyk/workproject/android-driver
task_budget_usd: 5.0
webhooks:
  secret: ${SISYPHUS_WEBHOOK_SECRET}
worker_env:
  ANDROID_HOME: ~/Library/Android/sdk
  JAVA_HOME: /Users/lenyk/Applications/Android Studio.app/Contents/jbr/Contents/Home
  PATH: ${JAVA_HOME}/bin:${ANDROID_HOME}/platform-tools:/opt/homebrew/bin:${PATH}
