api:
  allow_localhost: true
  token: ${SISYPHUS_API_TOKEN}
autopilot_tick_seconds: 30
daily_budget_usd: 0
default_model: deepseek
forge_poll:
  enabled: true
  interval_seconds: 300
github:
  base_url: ${GITHUB_BASE_URL}
  token: ${GITHUB_TOKEN}
gitlab:
  base_url: ${GITLAB_BASE_URL}
  token: ${GITLAB_TOKEN}
jira:
  base_url: ${JIRA_BASE_URL}
  email: ${JIRA_EMAIL}
  token: ${JIRA_API_TOKEN}
log_level: info
max_concurrent_workers: 2
max_review_loops: 3
openrouter:
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://openrouter.ai/api/v1
repos:
- branch: main
  check: cd sisyphus && env -u SISYPHUS_DB_READONLY python3 -m pytest -q
  name: sisyphus
  source: /Users/lenyk/workproject/agentsbox
task_budget_usd: 5.0
webhooks:
  secret: ${SISYPHUS_WEBHOOK_SECRET}
worker_env:
  PATH: /opt/homebrew/bin:${PATH}
