{% extends "base.html" %}
{% block title %}Repos — Sisyphus{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Repositories</h1>
        <div class="sub">Local paths or remotes.</div>
    </div>
    <div class="actions">
        <button class="btn btn--primary" hx-get="/api/repos/new-form" hx-target="body" hx-swap="beforeend">+ Add Repo</button>
    </div>
</div>
<div id="repos-list" hx-get="/api/repos/list" hx-trigger="load, reposUpdated from:body" hx-swap="innerHTML">
    <div class="empty">Loading…</div>
</div>
{% endblock %}
