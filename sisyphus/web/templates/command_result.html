<div class="panel" style="margin-top:12px">
    <span class="badge badge--accent cmd-badge--{{ result.kind }}">{{ result.kind }}</span>
    <form>
        <div class="field" style="margin-top:12px">
            <label>Title</label>
            <input name="title" value="{{ result.title }}">
        </div>
        <div class="field">
            <label>Goal</label>
            <textarea name="goal" rows="3">{{ result.goal }}</textarea>
        </div>
        <div class="field">
            <label>Repo</label>
            <select name="repo">
                <option value="">— none —</option>
                {% for r in repos %}
                <option value="{{ r.name }}" {% if r.name == result.repo %}selected{% endif %}>{{ r.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field" id="cmd-cron-field" style="{% if result.kind != 'automation' %}display:none{% endif %}">
            <label>Cron</label>
            <input name="cron" value="{{ result.cron }}">
        </div>
        <div style="display:flex;gap:8px;margin-top:12px">
            <button type="submit" formaction="/api/command/create-task" class="btn {% if result.kind == 'task' %}btn--primary{% else %}btn--ghost{% endif %}">Create task</button>
            <button type="submit" formaction="/api/command/create-plan" class="btn {% if result.kind == 'mission' %}btn--primary{% else %}btn--ghost{% endif %}">Make it a plan</button>
            <button type="submit" formaction="/api/command/create-automation" class="btn {% if result.kind == 'automation' %}btn--primary{% else %}btn--ghost{% endif %}">Make it an automation</button>
        </div>
    </form>
</div>
