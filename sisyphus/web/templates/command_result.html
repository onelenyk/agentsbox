<div class="panel" style="margin-top:12px">
    <div class="panel__head">
        <div style="display:flex;align-items:center;gap:8px">
            <span class="badge badge--accent cmd-badge--{{ result.kind }}">{{ result.kind }}</span>
            <span class="muted mono" style="font-size:11px">classified — you can change it below</span>
        </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
        <div class="field">
            <label>Title</label>
            <input name="title" value="{{ result.title }}" autocomplete="off">
        </div>
        <div class="field">
            <label>Goal</label>
            <textarea name="goal" rows="3">{{ result.goal }}</textarea>
        </div>
        <div class="field">
            <label>Repo</label>
            <select name="repo">
                <option value="">— none —</option>
                {% for r in repos %}
                <option value="{{ r.name }}"{% if result.repo == r.name %} selected{% endif %}>{{ r.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field" id="cmd-cron-field"{% if result.kind != 'automation' %} style="display:none"{% endif %}>
            <label>Cron schedule</label>
            <input name="cron" value="{{ result.cron }}" placeholder="0 3 * * *" autocomplete="off">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
            <form hx-post="/api/command/create-task" hx-target="#cmd-result" style="margin:0">
                <input type="hidden" name="title" value="{{ result.title }}">
                <input type="hidden" name="goal" value="{{ result.goal }}">
                <input type="hidden" name="repo" value="{{ result.repo }}">
                <button type="submit" class="btn{% if result.kind == 'task' %} btn--primary{% else %} btn--ghost{% endif %}">Create task</button>
            </form>
            <form hx-post="/api/command/create-plan" hx-target="#cmd-result" style="margin:0">
                <input type="hidden" name="title" value="{{ result.title }}">
                <input type="hidden" name="goal" value="{{ result.goal }}">
                <input type="hidden" name="repo" value="{{ result.repo }}">
                <button type="submit" class="btn{% if result.kind == 'mission' %} btn--primary{% else %} btn--ghost{% endif %}">Make it a plan</button>
            </form>
            <form hx-post="/api/command/create-automation" hx-target="#cmd-result" style="margin:0">
                <input type="hidden" name="title" value="{{ result.title }}">
                <input type="hidden" name="goal" value="{{ result.goal }}">
                <input type="hidden" name="repo" value="{{ result.repo }}">
                <input type="hidden" name="cron" value="{{ result.cron }}">
                <button type="submit" class="btn{% if result.kind == 'automation' %} btn--primary{% else %} btn--ghost{% endif %}">Make it an automation</button>
            </form>
        </div>
    </div>
</div>
