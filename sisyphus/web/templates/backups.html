{% extends "base.html" %}
{% block title %}Backups — Sisyphus{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Backups</h1>
        <div class="sub">Point-in-time snapshots of the daemon database — tasks, threads, agents, runtimes, usage.</div>
    </div>
    <div class="actions">
        <button class="btn btn--primary" hx-post="/api/backups/create" hx-target="#backups-list" hx-swap="innerHTML">+ Create backup</button>
    </div>
</div>
<div id="backups-list" hx-get="/api/backups/list" hx-trigger="load" hx-swap="innerHTML">
    <div class="empty">Loading…</div>
</div>
{% endblock %}
