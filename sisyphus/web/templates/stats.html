{% extends "base.html" %}
{% block title %}Statistics — Sisyphus{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Statistics</h1>
        <div class="sub">Activity and token/cost usage across all tasks.</div>
    </div>
    <div class="actions">
        <button class="btn btn--ghost" hx-get="/api/stats/view" hx-target="#stats-view" hx-swap="innerHTML">Refresh</button>
    </div>
</div>
<div id="stats-view" hx-get="/api/stats/view" hx-trigger="load" hx-swap="innerHTML">
    <div class="empty">Loading…</div>
</div>
{% endblock %}
