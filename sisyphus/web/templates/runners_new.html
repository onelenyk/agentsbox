<div class="modal-overlay active" onclick="if(event.target===this)this.remove()">
    <div class="modal" onclick="event.stopPropagation()">
        <h2>Add Runner</h2>
        <form hx-post="/api/runners" hx-target="#modal-container" hx-swap="outerHTML" hx-on:after-request="htmx.trigger('#runners-list', 'load')">
            <div class="form-group"><label>Name</label><input type="text" name="name" placeholder="opencode-deepseek" required></div>
            <div class="form-group"><label>Binary</label><input type="text" name="binary" placeholder="opencode" required></div>
            <div class="form-group"><label>Type</label>
                <select name="type">
                    <option value="opencode">opencode</option>
                    <option value="claude-cli">claude-cli</option>
                    <option value="ollama">ollama</option>
                    <option value="openai-api">openai-api</option>
                    <option value="custom">custom</option>
                </select>
            </div>
            <div class="form-group"><label>Model</label><input type="text" name="model" placeholder="deepseek/deepseek-v4"></div>
            <div class="form-group"><label>API Key Env</label><input type="text" name="api_key_env" placeholder="OPENROUTER_API_KEY"></div>
            <div class="form-group"><label>Base URL</label><input type="text" name="base_url" placeholder="https://openrouter.ai/api/v1"></div>
            <div class="form-actions">
                <button type="button" class="btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                <button type="submit" class="btn btn-primary">Add Runner</button>
            </div>
        </form>
    </div>
</div>
