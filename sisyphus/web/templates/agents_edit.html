<div id="editAgentModal" class="modal-overlay active" onclick="if(event.target===this)this.remove()">
    <div class="modal" onclick="event.stopPropagation()">
        <h2>Edit {{ agent.name }}</h2>
        <form hx-post="/api/agents/{{ agent.name }}/edit" hx-target="#editAgentModal" hx-swap="outerHTML">
            <div class="form-group">
                <label>Persona</label>
                <textarea name="persona" rows="3">{{ agent.persona }}</textarea>
            </div>
            <div class="form-group">
                <label>Tools</label>
                <div style="display:flex;flex-wrap:wrap;gap:8px">
                    {% for t in catalog %}
                    <label style="font-size:12px;font-weight:400;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" name="tools" value="{{ t }}" {% if t in agent.tools %}checked{% endif %}> {{ t }}
                    </label>
                    {% endfor %}
                </div>
            </div>
            <div class="form-group">
                <label>Runtime</label>
                <select name="runner_id">
                    <option value="">default runner</option>
                    {% for r in runners %}
                    <option value="{{ r.id }}" {% if r.id == agent.runner_id %}selected{% endif %}>{{ r.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Model override (optional)</label>
                <input name="model" value="{{ agent.model }}" placeholder="leave blank to use the runtime's model">
            </div>
            <div class="form-actions" style="display:flex;gap:8px">
                <button type="button" class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
