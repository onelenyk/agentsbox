<div class="modal-backdrop" onclick="if(event.target===this)this.remove()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal__head"><h2>Add Repository</h2></div>
        <form hx-post="/api/repos" hx-target="#modal-container" hx-swap="outerHTML" hx-on:after-request="htmx.trigger('#repos-list', 'load')">
            <div class="modal__body">
                <div class="field"><label>Name</label><input type="text" name="name" placeholder="android-driver" required></div>
                <div class="field"><label>Source (local path or git URL)</label><input type="text" name="source" placeholder="/Users/… or git@…" required></div>
                <div class="field"><label>Branch</label><input type="text" name="branch" value="main"></div>
                <div class="field"><label>Platform</label>
                    <select name="platform">
                        <option value="">Auto-detect</option>
                        <option value="local">Local</option>
                        <option value="gitlab">GitLab</option>
                        <option value="github">GitHub</option>
                    </select>
                </div>
                {# The dropdown above is a claim about this repo, and saving used
                   to be the only thing that ever tested it — badly, since a
                   clone succeeds long before a missing forge token matters.
                   Checking here costs a few seconds instead of a whole task. #}
                <div id="new-repo-check"></div>
            </div>
            <div class="modal__actions">
                <button type="button" class="btn btn--ghost" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
                <button type="button" class="btn btn--ghost" hx-post="/api/repos/check"
                        hx-include="closest form" hx-target="#new-repo-check" hx-swap="innerHTML"
                        hx-disabled-elt="this"
                        hx-on:htmx:before-request="this.textContent='Checking…'"
                        {# The form's own hx-on:after-request reloads the repos list; this
                           request is not a save, so stop the event before it bubbles there. #}
                        hx-on:htmx:after-request="event.stopPropagation(); this.textContent='Check connection'">Check connection</button>
                <button type="submit" class="btn btn--primary">Clone &amp; Add</button>
            </div>
        </form>
    </div>
</div>
