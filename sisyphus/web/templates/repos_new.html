<div class="modal-backdrop" onclick="if(event.target===this)this.remove()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal__head"><h2>Add Repository</h2></div>
        <form hx-post="/api/repos" hx-target="#modal-container" hx-swap="outerHTML" hx-on:after-request="htmx.trigger('#repos-list', 'load')">
            <div class="modal__body">
                <div class="field"><label>Name</label><input type="text" name="name" placeholder="android-driver" required></div>
                <div class="field"><label>Source (local path or git URL)</label><input type="text" name="source" placeholder="/Users/… or git@…" required></div>
                <div class="field"><label>Branch</label><input type="text" name="branch" value="main"></div>
            </div>
            <div class="modal__actions">
                <button type="button" class="btn btn--ghost" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
                <button type="submit" class="btn btn--primary">Clone &amp; Add</button>
            </div>
        </form>
    </div>
</div>
