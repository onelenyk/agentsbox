<div id="newTaskModal" class="modal-backdrop" onclick="if(event.target===this)this.remove()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal__head"><h2>New Task</h2></div>
        <form hx-post="/api/tasks" hx-target="#newTaskModal" hx-swap="outerHTML">
            <div class="modal__body">
                <div class="tmpl-chips">
                    <button type="button" class="chip-btn" onclick="ntTemplate('bug', this)">🐞 Bug</button>
                    <button type="button" class="chip-btn" onclick="ntTemplate('feature', this)">✨ Feature</button>
                    <button type="button" class="chip-btn" onclick="ntTemplate('refactor', this)">♻ Refactor</button>
                    <button type="button" class="chip-btn" onclick="ntTemplate('research', this)">🔍 Research</button>
                    <button type="button" class="chip-btn" onclick="ntTemplate('review', this)">👀 Review</button>
                </div>
                <input type="hidden" name="template" id="nt-template" value="">

                <div class="field">
                    <label class="row" style="justify-content:space-between;width:100%">
                        <span>Goal</span>
                        <button type="button" class="btn btn--ghost btn--sm" id="nt-ai" onclick="ntParse()"
                                title="Let AI turn rough words into a clear, structured task (and detect the repo)">✨ AI structure</button>
                    </label>
                    <textarea name="goal" id="nt-goal" rows="4" required
                              placeholder="Describe what should get done — or pick a template above. Rough words are fine; hit ✨ AI to structure them and auto-detect the repo."></textarea>
                </div>
                <div class="field">
                    <label>Repository</label>
                    <select name="repo" id="nt-repo">
                        <option value="" selected>None — research / planning / Q&A</option>
                        {% for r in repos %}
                        <option value="{{ r.name }}">{{ r.name }}</option>
                        {% endfor %}
                    </select>
                    <span class="hint">A repo-less task runs read-only in a scratch dir — no commits or merge requests.</span>
                </div>
                <div class="field">
                    <label>Handled by</label>
                    <select name="agent" id="nt-agent">
                        <option value="" selected>Auto — orchestrator dispatches</option>
                        {% for a in agents %}
                        <option value="{{ a.name }}">{{ a.name }} (solo)</option>
                        {% endfor %}
                    </select>
                    <span class="hint">Pick an agent to run it solo, or leave on Auto to let the orchestrator coordinate.</span>
                </div>
            </div>
            <div class="modal__actions">
                <button type="button" class="btn btn--ghost" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
                <button type="submit" class="btn btn--primary">Create Task</button>
            </div>
        </form>
    </div>
</div>
<script>
    const NT_TEMPLATES = {
        bug: "Diagnose and fix: <describe the bug and when it happens>.\nAdd a regression test that fails before and passes after. Commit and open a merge request.",
        feature: "Add <feature name>: <what it does + acceptance criteria>.\nInclude tests. Commit and open a merge request.",
        refactor: "Refactor <target> so that <goal>, keeping behaviour identical.\nUpdate any affected tests. Commit and open a merge request.",
        research: "Research and recommend: <question>.\nGive 3 pros, 3 cons, and a one-line recommendation.",
        review: "Review <branch or change>: verify correctness, code style, and tests.\nApprove, or request changes with specifics.",
    };
    const NT_DEFAULTS = { research: { repo: "" } };  // research is repo-less by default

    function ntTemplate(key, btn) {
        document.getElementById('nt-goal').value = NT_TEMPLATES[key] || '';
        document.getElementById('nt-template').value = key;
        const d = NT_DEFAULTS[key];
        if (d && 'repo' in d) document.getElementById('nt-repo').value = d.repo;
        document.querySelectorAll('#newTaskModal .chip-btn').forEach(b => b.classList.toggle('is-on', b === btn));
        const g = document.getElementById('nt-goal');
        g.focus();
        const i = g.value.indexOf('<');            // select the first <placeholder>
        if (i >= 0) { const j = g.value.indexOf('>', i); g.setSelectionRange(i, j + 1); }
    }

    async function ntParse() {
        const btn = document.getElementById('nt-ai');
        const goal = document.getElementById('nt-goal').value.trim();
        if (!goal) { document.getElementById('nt-goal').focus(); return; }
        const orig = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = '✨ thinking…';
        try {
            const body = new URLSearchParams({ text: goal, template: document.getElementById('nt-template').value });
            const r = await fetch('/api/tasks/ai-parse', { method: 'POST', body });
            if (!r.ok) throw new Error('bad');
            const d = await r.json();
            if (d.goal) document.getElementById('nt-goal').value = d.goal;
            const setSel = (id, v) => { const s = document.getElementById(id); if (v != null && [...s.options].some(o => o.value === v)) s.value = v; };
            setSel('nt-repo', d.repo);
            setSel('nt-agent', d.agent);
            btn.innerHTML = orig;
        } catch (e) {
            btn.innerHTML = '✨ AI unavailable';
            setTimeout(() => { btn.innerHTML = orig; }, 1800);
        }
        btn.disabled = false;
    }
</script>
