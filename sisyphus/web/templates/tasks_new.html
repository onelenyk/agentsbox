<div id="newTaskModal" class="modal-overlay active" onclick="if(event.target===this)this.remove()">
    <div class="modal" onclick="event.stopPropagation()">
        <h2>New Task</h2>
        <form hx-post="/api/tasks" hx-target="#newTaskModal" hx-swap="outerHTML">
            <div class="form-group">
                <label>Goal</label>
                <textarea name="goal" rows="3" required placeholder="What should get done?"></textarea>
            </div>
            <div class="form-group">
                <label>Repository</label>
                <select name="repo">
                    <option value="" selected>None — research / planning / Q&A</option>
                    {% for r in repos %}
                    <option value="{{ r.name }}">{{ r.name }}</option>
                    {% endfor %}
                </select>
                <div style="font-size:11px;color:#8b949e;margin-top:4px">A repo-less task runs read-only in a scratch dir — no commits or merge requests.</div>
            </div>
            <div class="form-actions" style="display:flex;gap:8px">
                <button type="button" class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                <button type="submit" class="btn btn-primary">Create</button>
            </div>
        </form>
    </div>
</div>
