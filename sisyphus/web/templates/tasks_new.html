<div id="newTaskModal" class="modal-backdrop" onclick="if(event.target===this)this.remove()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal__head"><h2>New Task</h2></div>
        <form hx-post="/api/tasks" hx-target="#newTaskModal" hx-swap="outerHTML">
            <div class="modal__body">
                <div class="field">
                    <label>Goal</label>
                    <textarea name="goal" rows="3" required placeholder="What should get done?"></textarea>
                </div>
                <div class="field">
                    <label>Repository</label>
                    <select name="repo">
                        <option value="" selected>None — research / planning / Q&A</option>
                        {% for r in repos %}
                        <option value="{{ r.name }}">{{ r.name }}</option>
                        {% endfor %}
                    </select>
                    <span class="hint">A repo-less task runs read-only in a scratch dir — no commits or merge requests.</span>
                </div>
                <div class="field">
                    <label>Handled by</label>
                    <select name="agent">
                        <option value="" selected>Auto — orchestrator dispatches</option>
                        {% for a in agents %}
                        <option value="{{ a.name }}">{{ a.name }} (solo)</option>
                        {% endfor %}
                    </select>
                    <span class="hint">Pick an agent to run it solo, or leave on Auto to let the orchestrator coordinate.</span>
                </div>
            </div>
            <div class="modal__actions">
                <button type="button" class="btn btn--ghost" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
                <button type="submit" class="btn btn--primary">Create Task</button>
            </div>
        </form>
    </div>
</div>
