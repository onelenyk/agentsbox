{% extends "base.html" %}
{% block title %}Agents — Sisyphus{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Agents</h1>
    </div>
    <div class="actions">
        <button class="btn btn--primary" hx-get="/api/agents/new-form" hx-target="body" hx-swap="beforeend">+ Add Agent</button>
    </div>
</div>
<section class="sect">
    <h2 class="sect__h">Running now</h2>
    <div id="workers-live" hx-get="/api/workers/live" hx-trigger="load, every 5s" hx-swap="innerHTML"></div>
</section>
<div id="agents-list" hx-get="/api/agents/list" hx-trigger="load, agentsUpdated from:body" hx-swap="innerHTML">
    <div class="empty">Loading…</div>
</div>
{% endblock %}
