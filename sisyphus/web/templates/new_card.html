<div id="newCardModal" class="modal-overlay active" onclick="if(event.target===this)this.classList.remove('active')">
    <div class="modal" onclick="event.stopPropagation()">
        <h2>New Card</h2>
        <form hx-post="/api/cards" hx-target="#newCardModal" hx-swap="outerHTML" id="newCardForm">
            <input type="hidden" name="run_now" id="runNowField" value="0">
            <div class="form-group">
                <label>Pipeline</label>
                <select name="pipeline" required>
                    {% for p in pipelines %}
                    <option value="{{ p }}">{{ p }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Repository</label>
                <select name="repo" required>
                    {% for r in repos %}
                    <option value="{{ r.name }}">{{ r.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="3" required placeholder="What should the agent do?"></textarea>
            </div>
            <div class="form-group">
                <label>Jira URL (optional)</label>
                <input type="text" name="jira_url" placeholder="https://vanongo.atlassian.net/browse/SLN-...">
            </div>
            <div class="form-actions" style="display:flex;gap:8px">
                <button type="button" class="btn btn-secondary" onclick="this.closest('.modal-overlay').classList.remove('active')">Cancel</button>
                <button type="submit" class="btn btn-secondary" onclick="document.getElementById('runNowField').value='0'">Add to Backlog</button>
                <button type="submit" class="btn btn-primary" onclick="document.getElementById('runNowField').value='1'">Create & Run</button>
            </div>
        </form>
    </div>
</div>
