{% if sessions %}
{% for s in sessions %}
<div class="cp-session-row">
    <button class="cp-session-open" hx-get="/api/board/copilot/{{ s.id }}"
            hx-target="#cp-body" hx-swap="innerHTML" onclick="cpCloseSessions()">
        {{ s.title }}<span class="cp-session-time">{{ s.updated_at[5:16].replace('T',' ') }}</span>
    </button>
    <button class="cp-session-del" hx-post="/api/board/copilot/{{ s.id }}/delete"
            hx-target="#cp-body" hx-swap="innerHTML" title="Delete chat" onclick="cpCloseSessions()">✕</button>
</div>
{% endfor %}
{% else %}
<div class="empty" style="padding:12px">No chats yet.</div>
{% endif %}
