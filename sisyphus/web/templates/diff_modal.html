<div class="modal-backdrop" onclick="if(event.target===this)this.remove()">
    <div class="modal modal--wide modal--tall" onclick="event.stopPropagation()">
        <div class="modal__head modal__head--row">
            <div class="mr-title">
                <h2>Diff</h2>
                <code class="mono">{{ filename }}</code>
            </div>
            <div class="row diff__actions">
                <span class="diffstat"><span class="add">+{{ adds }}</span> <span class="del">−{{ dels }}</span></span>
                <button class="btn btn--ghost btn--sm" onclick="this.closest('.modal-backdrop').remove()">Close</button>
            </div>
        </div>
        <div class="modal__body">
            <div class="diff">{% for cls, ln in lines %}<span class="dl {{ cls }}">{{ ln }}</span>{% endfor %}</div>
        </div>
    </div>
</div>
