{% extends "base.html" %}
{% block title %}Planner — Sisyphus{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Mission Planner</h1>
        <div class="sub">Plan a big goal into a project-aware brief, then release it as tasks.</div>
    </div>
    <div class="actions">
        <button class="btn btn--primary" hx-post="/api/plans/new" hx-target="#plan-body" hx-swap="innerHTML">+ New Plan</button>
    </div>
</div>
<div id="plan-body" hx-get="/api/plans/panel" hx-trigger="load" hx-swap="innerHTML">
    <div class="empty">Loading…</div>
</div>

<script src="/static/mermaid.min.js"></script>
<script>
    if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
    // Render each diagram individually: the DAG is generated by us (always valid),
    // but the model-authored interaction diagram can contain invalid mermaid. Validate
    // first and show the source as a graceful fallback instead of mermaid's error graphic.
    async function planRenderMermaid() {
        if (!window.mermaid) return;
        var els = document.querySelectorAll('#plan-body .mermaid:not([data-processed])');
        for (var i = 0; i < els.length; i++) {
            var el = els[i], src = el.textContent.trim();
            try {
                await mermaid.parse(src);              // throws on invalid syntax
                await mermaid.run({ nodes: [el] });
            } catch (e) {
                el.setAttribute('data-processed', 'true');
                el.classList.add('mermaid-failed');
                var note = document.createElement('div');
                note.className = 'mermaid-fallback';
                note.textContent = 'Diagram couldn’t render — showing its source:';
                var pre = document.createElement('pre');
                pre.className = 'mermaid-src';
                pre.textContent = src;
                el.textContent = '';
                el.appendChild(note);
                el.appendChild(pre);
            }
        }
    }
    function cpScroll() {
        var t = document.getElementById('cp-thread');
        if (t) t.scrollTop = t.scrollHeight;
    }
    // Seed the composer from a starter / question chip and focus it.
    function cpSeed(text) {
        var i = document.getElementById('cp-input');
        if (!i) return;
        i.value = text;
        i.focus();
        i.setSelectionRange(i.value.length, i.value.length);
    }
    document.body.addEventListener('htmx:afterSwap', function (e) {
        if (e.target && e.target.id === 'plan-body') { planRenderMermaid(); cpScroll(); }
    });
</script>
{% endblock %}
