{% extends "base.html" %}
{% block title %}Tasks — Sisyphus{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Tasks</h1>
        <div class="sub">Autonomous work, coordinated on one thread per task.</div>
    </div>
    <div class="actions">
        <button class="btn btn--primary" hx-get="/api/tasks/new-form" hx-target="#modal-container">+ New Task</button>
    </div>
</div>
<div id="tasks-list" hx-get="/api/tasks/list" hx-trigger="load, taskCreated from:body, taskUpdated from:body" hx-swap="innerHTML">
    <div class="empty">Loading…</div>
</div>
{% endblock %}
