{% extends "base.html" %}
{% block title %}Mission Control — Sisyphus{% endblock %}
{% import "_ui.html" as ui %}
{% block content %}
{% call ui.toolbar([{'label': 'Home'}]) %}
<span class="liveflag"><span class="led live"></span> LIVE</span>
{% endcall %}
{% include "_task_box.html" %}
<div id="inbox" hx-get="/api/inbox/view" hx-trigger="load, dataChanged from:body, taskUpdated from:body, inboxChanged, every 300s" hx-swap="innerHTML"></div>
<div id="dash" hx-get="/api/dashboard/view" hx-trigger="load, dataChanged from:body, every 300s" hx-swap="innerHTML transition:true">
    <div class="empty">Loading…</div>
</div>
{% endblock %}
