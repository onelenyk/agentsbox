{% extends "base.html" %}
{% block title %}Mission Control — Sisyphus{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Mission Control</h1>
        <div class="sub mono" id="dash-sub">live operational overview</div>
    </div>
    <span class="liveflag"><span class="led live"></span> LIVE</span>
</div>
<div class="panel" style="margin-bottom:14px">
    <form hx-post="/api/command/classify" hx-target="#cmd-result" hx-swap="innerHTML">
        <div style="display:flex;gap:8px">
            <input name="text" placeholder="What do you want to do? Type in plain words…" style="flex:1" autocomplete="off">
            <button type="submit" class="btn btn--primary">Classify</button>
        </div>
    </form>
    <div id="cmd-result" style="margin-top:12px"></div>
</div>
<div id="dash" hx-get="/api/dashboard/view" hx-trigger="load, every 5s" hx-swap="innerHTML">
    <div class="empty">Loading…</div>
</div>
{% endblock %}
