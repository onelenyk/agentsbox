{% extends "base.html" %}
{% block title %}Kanban — Sisyphus{% endblock %}
{% block content %}
<div class="header-bar">
    <h1>Kanban</h1>
    <button class="btn btn-primary" hx-get="/api/cards/new-form" hx-target="#modal-container">+ New</button>
</div>
<div id="board" hx-get="/api/cards/board" hx-trigger="load, cardCreated from:body, cardUpdated from:body, every 5s" hx-swap="innerHTML">
    <div class="empty-state"><p>Loading board...</p><div class="spinner" style="margin-top:12px"></div></div>
</div>
<div id="cardDetailPanel" class="modal-overlay" onclick="if(event.target===this)this.classList.remove('active')">
    <div id="card-detail" class="modal" style="width:680px;max-height:80vh;overflow-y:auto" onclick="event.stopPropagation()"></div>
</div>
{% endblock %}
