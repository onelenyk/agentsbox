<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sisyphus{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0a0c'/><text x='16' y='23' font-size='21' text-anchor='middle' fill='%23f5a623'>⚡</text></svg>">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="bolt">⚡</span> Sisyphus <small>v2</small></div>
            <nav class="nav">
                <div class="sec">Operate</div>
                <a href="/dashboard" class="{{ 'active' if active_page == 'dashboard' else '' }}"><span class="ic">◫</span> Dashboard</a>
                <a href="/tasks" class="{{ 'active' if active_page == 'tasks' else '' }}"><span class="ic">◇</span> Tasks</a>
                <a href="/stats" class="{{ 'active' if active_page == 'stats' else '' }}"><span class="ic">▤</span> Statistics</a>
                <div class="sec">Configure</div>
                <a href="/agents" class="{{ 'active' if active_page == 'agents' else '' }}"><span class="ic">✦</span> Agents</a>
                <a href="/runners" class="{{ 'active' if active_page == 'runners' else '' }}"><span class="ic">▸</span> Runtimes</a>
                <a href="/repos" class="{{ 'active' if active_page == 'repos' else '' }}"><span class="ic">⌥</span> Repos</a>
                <a href="/runtime" class="{{ 'active' if active_page == 'runtime' else '' }}"><span class="ic">⚙</span> Runtime</a>
                <a href="/backups" class="{{ 'active' if active_page == 'backups' else '' }}"><span class="ic">⧉</span> Backups</a>
            </nav>
            <div class="sys">
                <div class="line"><span id="daemon-led" class="led live"></span> daemon <span id="daemon-val" class="val">live</span></div>
                <div class="line"><span class="led amber"></span> ui <span class="val">v2.0</span></div>
            </div>
        </aside>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="modal-container"></div>
    <div id="toast" class="toast" style="display:none"></div>

    <script>
        function flash(msg, kind) {
            var t = document.getElementById("toast");
            t.textContent = msg;
            t.className = "toast " + (kind === "err" ? "toast--err" : "toast--ok");
            t.style.display = "block";
            clearTimeout(t._h);
            t._h = setTimeout(function () { t.style.display = "none"; }, kind === "err" ? 3200 : 2000);
        }
        var b = document.body;
        b.addEventListener("reposUpdated",  function () { flash("Saved"); });
        b.addEventListener("runnersUpdated", function () { flash("Saved"); });
        b.addEventListener("agentsUpdated",  function () { flash("Saved"); });
        b.addEventListener("taskCreated",    function () { flash("Task created"); });
        b.addEventListener("taskUpdated",    function () { flash("Updated"); });
        b.addEventListener("htmx:afterRequest", function (e) {
            if (e.detail.failed) flash("Error: " + (e.detail.xhr.statusText || "request failed"), "err");
        });

        // Daemon heartbeat — reflect real reachability + readiness in the LED.
        function setDaemon(state) {
            var l = document.getElementById("daemon-led");
            var v = document.getElementById("daemon-val");
            var cls = state === "live" ? "live" : (state === "degraded" ? "amber" : "dead");
            if (l) l.className = "led " + cls;
            if (v) v.textContent = state;
        }
        function heartbeat() {
            fetch("/api/v1/health", { cache: "no-store" })
                .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
                .then(function (j) { setDaemon(j.degraded ? "degraded" : "live"); })
                .catch(function () { setDaemon("down"); });
        }
        heartbeat();
        setInterval(heartbeat, 10000);
    </script>
</body>
</html>
