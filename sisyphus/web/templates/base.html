<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sisyphus{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230d1117'/><text x='16' y='23' font-size='22' text-anchor='middle' fill='%2358a6ff'>⚡</text></svg>">
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Navbar */
        nav {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 56px;
            gap: 8px;
        }
        nav .brand {
            font-size: 18px;
            font-weight: 700;
            color: #f0f6fc;
            margin-right: 24px;
        }
        nav a {
            color: #8b949e;
            font-size: 14px;
            padding: 8px 14px;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
        }
        nav a:hover {
            color: #f0f6fc;
            background: #1f2937;
            text-decoration: none;
        }
        nav a.active { color: #f0f6fc; background: #1f2937; }

        /* Content */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Kanban Grid */
        .kanban-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            min-height: calc(100vh - 120px);
        }
        .kanban-col {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }
        .kanban-col h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8b949e;
            padding: 8px 12px;
            border-bottom: 1px solid #30363d;
            margin-bottom: 12px;
        }
        .kanban-col .count {
            background: #21262d;
            color: #8b949e;
            border-radius: 12px;
            padding: 0 8px;
            font-size: 12px;
            margin-left: 8px;
        }

        /* Cards */
        .card {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .card:hover {
            border-color: #58a6ff;
            background: #1c2128;
        }
        .card .title {
            font-size: 14px;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 4px;
        }
        .card .meta {
            font-size: 12px;
            color: #8b949e;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card .meta .badge {
            background: #1f2937;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
        }
        .card .pipeline-tag {
            font-size: 11px;
            color: #58a6ff;
        }
        .card .card-stats {
            font-size: 11px;
            color: #6e7681;
            margin-top: 6px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .card .card-stats .stat-error {
            color: #f85149;
            font-size: 10px;
            word-break: break-all;
        }
        .card .card-resources {
            margin-top: 4px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .card .resource-badge {
            background: #1b3a2d;
            color: #3fb950;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
            font-family: monospace;
        }
        .card .platform-badge {
            background: #2d1f3d;
            color: #bc8cff;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
            text-transform: uppercase;
        }
        .card .stat-time-created {
            font-size: 10px;
            color: #484f58;
        }
        .card .jira-link {
            font-size: 10px;
            color: #58a6ff;
            text-decoration: none;
            margin-left: auto;
        }
        .card .jira-link:hover {
            text-decoration: underline;
        }
        .card .card-actions {
            margin-top: 8px;
        }
        .card .card-actions .btn {
            width: 100%;
            justify-content: center;
        }

        /* Detail Panel */
        .detail-panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }
        .detail-panel h2 {
            font-size: 20px;
            color: #f0f6fc;
            margin-bottom: 16px;
        }
        .detail-panel h3 {
            font-size: 16px;
            color: #f0f6fc;
            margin: 20px 0 12px;
        }
        .detail-panel .info-row {
            display: flex;
            gap: 8px;
            padding: 6px 0;
            font-size: 14px;
        }
        .detail-panel .info-row .label {
            color: #8b949e;
            min-width: 100px;
        }
        .detail-panel .info-row .value {
            color: #f0f6fc;
        }

        /* Steps Table */
        .steps-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .steps-table th {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 2px solid #30363d;
            color: #8b949e;
            font-weight: 600;
        }
        .steps-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #21262d;
        }
        .steps-table tr:hover td { background: #1c2128; }

        /* Status badges */
        .status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
        .status-created { background: #21262d; color: #8b949e; }
        .status-running { background: #1f3a5f; color: #58a6ff; }
        .status-completed { background: #1b3a2d; color: #3fb950; }
        .status-failed { background: #3d1f1f; color: #f85149; }
        .status-review { background: #3d2e1f; color: #d29922; }
        .status-cancelled { background: #21262d; color: #8b949e; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 28px;
            width: 520px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h2 {
            font-size: 20px;
            color: #f0f6fc;
            margin-bottom: 20px;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal label {
            display: block;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #f0f6fc;
            font-size: 14px;
            font-family: inherit;
        }
        .modal input:focus, .modal select:focus, .modal textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .modal textarea { min-height: 80px; resize: vertical; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-primary {
            background: #238636;
            color: #fff;
            border-color: #2ea043;
        }
        .btn-primary:hover { background: #2ea043; }
        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
            border-color: #30363d;
        }
        .btn-secondary:hover { background: #30363d; }
        .btn-danger {
            background: #3d1f1f;
            color: #f85149;
            border-color: #f85149;
        }
        .btn-danger:hover { background: #5c1f1f; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }

        /* Tables (generic) */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .data-table th {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 2px solid #30363d;
            color: #8b949e;
            font-weight: 600;
        }
        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #21262d;
        }
        .data-table tr:hover td { background: #1c2128; }

        /* Stats cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }
        .stat-card .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #f0f6fc;
        }
        .stat-card .stat-label {
            font-size: 13px;
            color: #8b949e;
            margin-top: 4px;
        }

        /* Header actions bar */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .header-bar h1 {
            font-size: 24px;
            color: #f0f6fc;
        }

        /* Agent cards */
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .agent-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
        }
        .agent-card .agent-name {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
        }
        .agent-card .agent-role {
            font-size: 13px;
            color: #8b949e;
            margin-top: 4px;
        }

        /* Mermaid container */
        .mermaid-container {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin: 12px 0;
            overflow-x: auto;
        }

        /* Empty state */
        .empty-state {
            padding: 40px;
            text-align: center;
            color: #8b949e;
        }
        .empty-state p { font-size: 14px; }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .header-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .kanban-grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; }
        .kanban-col { background:#161b22; border:1px solid #30363d; border-radius:8px; min-height:200px; display:flex; flex-direction:column; }
        .kanban-col h2 { padding:12px 16px; font-size:13px; font-weight:600; color:#f0f6fc; border-bottom:1px solid #21262d; display:flex; justify-content:space-between; margin:0; }
        .kanban-col h2 .count { background:#21262d; padding:1px 8px; border-radius:12px; font-size:11px; font-weight:400; }
        .kanban-col .card { margin:8px; }
        .card .title { font-size:13px; color:#c9d1d9; margin-bottom:8px; line-height:1.4; }
        .card .meta { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
        .pipeline-tag { background:#1f3a5f; color:#58a6ff; padding:1px 6px; border-radius:4px; font-size:10px; font-weight:500; }
        .badge { background:#21262d; color:#8b949e; padding:1px 6px; border-radius:4px; font-size:10px; }
        .status-badge { padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600; text-transform:uppercase; }
        .status-badge.completed { background:#1b3a2d; color:#3fb950; }
        .status-badge.running { background:#1f3a5f; color:#58a6ff; }
        .status-badge.failed { background:#3d1f1f; color:#f85149; }
        .status-badge.created, .status-badge.pending { background:#21262d; color:#8b949e; }
        .info-row { display:flex; padding:6px 0; border-bottom:1px solid #21262d; font-size:13px; }
        .info-row .label { color:#8b949e; min-width:100px; }
        .info-row .value { color:#c9d1d9; }
        .steps-table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
        .steps-table th { text-align:left; padding:6px 8px; color:#8b949e; border-bottom:1px solid #21262d; font-weight:500; }
        .steps-table td { padding:6px 8px; border-bottom:1px solid #21262d; }
        .resource-item { padding:6px 8px; border-bottom:1px solid #21262d; font-size:12px; display:flex; justify-content:space-between; }
        .resource-item a { color:#58a6ff; text-decoration:none; }
        .resource-item a:hover { text-decoration:underline; }
        .empty-state { text-align:center; padding:40px 20px; color:#8b949e; }
        .empty-state p { font-size:14px; margin-bottom:8px; }
        .mermaid-container { background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:16px; margin:12px 0; }
        nav a.active { color:#f0f6fc !important; background:#1f3a5f !important; }
        .stat-card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:20px; text-align:center; }
        .stat-card .stat-value { font-size:36px; font-weight:700; }
        .stat-card .stat-label { font-size:12px; color:#8b949e; margin-top:4px; text-transform:uppercase; letter-spacing:0.5px; }
        .agent-card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px; }
        .agent-card .agent-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
        .agent-card .agent-name { font-size:15px; font-weight:600; color:#f0f6fc; }
        .agent-card .agent-role { font-size:12px; color:#8b949e; margin-top:2px; }
        .agent-card .agent-meta { font-size:12px; color:#8b949e; }
        .agent-card .agent-meta span { color:#c9d1d9; }
        .access-badge { padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
        .access-badge.read { background:#21262d; color:#8b949e; }
        .access-badge.analyze { background:#1f3a5f; color:#58a6ff; }
        .access-badge.edit { background:#3d1f1f; color:#f85149; }

        /* HTMX loading states */
        .htmx-indicator { display:none; }
        .htmx-request .htmx-indicator { display:inline-block; }
        .htmx-request.btn { opacity:0.7; pointer-events:none; }
        .error-banner { background:#3d1f1f; border:1px solid #f85149; color:#f85149; padding:12px 16px; border-radius:6px; margin-bottom:16px; font-size:13px; }
        .success-banner { background:#1b3a2d; border:1px solid #3fb950; color:#3fb950; padding:12px 16px; border-radius:6px; margin-bottom:16px; font-size:13px; }
        .toast { position:fixed; bottom:24px; right:24px; z-index:9999; animation:slideIn 0.3s ease; }
        @keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
    
        /* Tables */
        table.data-table, table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
        thead th { text-align: left; padding: 10px 14px; color: #8b949e; border-bottom: 2px solid #30363d; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; background: #161b22; }
        tbody td { padding: 10px 14px; border-bottom: 1px solid #21262d; font-size: 13px; color: #c9d1d9; }
        tbody tr:hover td { background: #1a1f2e; }

    </style>
</head>
<body>
    <nav>
        <span class="brand">⚡ Sisyphus</span>
        <a href="/kanban" class="{{ 'active' if active_page == 'kanban' else '' }}">Kanban</a>
        <a href="/dashboard" class="{{ 'active' if active_page == 'dashboard' else '' }}">Dashboard</a>
        <a href="/agents" class="{{ 'active' if active_page == 'agents' else '' }}">Agents</a>
        <a href="/runtime" class="{{ 'active' if active_page == 'runtime' else '' }}">Runtime</a>
        <a href="/pipelines" class="{{ 'active' if active_page == 'pipelines' else '' }}">Pipelines</a>
        <a href="/history" class="{{ 'active' if active_page == 'history' else '' }}">History</a>
        <a href="/repos" class="{{ 'active' if active_page == 'repos' else '' }}">Repos</a>
        <a href="/runners" class="{{ 'active' if active_page == 'runners' else '' }}">Runners</a>
    </nav>
    <div id="htmx-indicator" class="htmx-indicator" style="position:fixed;top:60px;left:50%;z-index:9999">
        <div class="spinner"></div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
        mermaid.initialize({ theme: 'dark', startOnLoad: false });
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.mermaid').forEach(el => mermaid.run({ nodes: [el] }));
        });
        document.addEventListener('htmx:afterSwap', () => {
            document.querySelectorAll('.mermaid').forEach(el => mermaid.run({ nodes: [el] }));
        });
    </script>
<div id="modal-container"></div>

<div id="toast" class="toast" style="display:none"></div>
<script>

document.body.addEventListener("cardCreated", function() {
    var t = document.getElementById("toast");
    t.textContent = "✓ Card created";
    t.className = "toast success-banner";
    t.style.display = "block";
    setTimeout(function() { t.style.display = "none"; }, 2000);
});
document.body.addEventListener("cardUpdated", function() {
    var t = document.getElementById("toast");
    t.textContent = "✓ Updated";
    t.className = "toast success-banner";
    t.style.display = "block";
    setTimeout(function() { t.style.display = "none"; }, 2000);
});
document.body.addEventListener("reposUpdated", function() {
    var t = document.getElementById("toast");
    t.textContent = "✓ Done";
    t.className = "toast success-banner";
    t.style.display = "block";
    setTimeout(function() { t.style.display = "none"; }, 2000);
});
document.body.addEventListener("htmx:afterRequest", function(evt) {
    if (evt.detail.failed) {
        var t = document.getElementById("toast");
        t.textContent = "✗ Error: " + (evt.detail.xhr.statusText || "failed");
        t.className = "toast error-banner";
        t.style.display = "block";
        setTimeout(function() { t.style.display = "none"; }, 3000);
    }
});
</script>

</body>
</html>
