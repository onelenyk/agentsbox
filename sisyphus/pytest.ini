[pytest]
asyncio_mode = auto
testpaths = tests
norecursedirs = workspace .git *.egg .venv venv node_modules
markers =
    unit: in-process logic, tmp SQLite at most — no subprocesses, no git
    component: one subsystem against the real thing it drives (routes, git repos, MCP server)
    process: real OS processes — spawning, signals, sandbox, timeouts
    e2e: a whole path through the system, artifacts checked at the end
