name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sisyphus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check core web tools tests
      - name: Run tests under coverage
        run: python -m coverage run --source=core,web -m pytest -q --ignore=tests/e2e
      - name: Coverage floors (per-directory; see tests/coverage_report.md)
        run: |
          python -m coverage report
          python -m coverage report --include='core/*' --fail-under=88
          python -m coverage report --include='web/*' --fail-under=74
